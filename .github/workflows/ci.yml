name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  STELLAR_CLI_VERSION: "26.0.0"

jobs:
  # ----------------------------------------------------------------
  #  Security Audit
  # ----------------------------------------------------------------
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------
  #  PR Title Lint
  # ----------------------------------------------------------------
  pr-title-lint:
    name: PR Title Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Lint PR title
        run: |
          echo "PR title: ${{ github.event.pull_request.title }}"
          if ! echo "${{ github.event.pull_request.title }}" | grep -Eq '^(feat|fix|test|docs|ci|chore|refactor|security|perf)(\(.+\))?: .+'; then
            echo "ERROR: PR title must follow conventional commits."
            echo "Expected pattern: ^(feat|fix|test|docs|ci|chore|refactor|security|perf)(\(.+\))?: .+"
            exit 1
          fi

  # ----------------------------------------------------------------
  #  Lint
  # ----------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --features testutils -- -D warnings

      - name: Build docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

  # ----------------------------------------------------------------
  #  Test
  # ----------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          cargo llvm-cov --features testutils \
            --lcov --output-path lcov.info \
            --fail-under-lines 80

      - name: Run doc tests
        run: cargo test --doc --features testutils

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: lcov.info
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  #  Performance Regression Tests
  # ----------------------------------------------------------------
  perf:
    name: Performance Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-perf-

      - name: Run performance benchmarks
        run: cargo test --features testutils --test perf_regression -- --nocapture

      - name: Compare against baseline
        env:
          PERF_BASELINE: tests/perf/baseline.json
          PERF_CURRENT: target/perf/current.json
          PERF_MAX_RESPONSE_TIME_REGRESSION: "0.10"
          PERF_MAX_MEMORY_REGRESSION: "0.15"
        run: |
          if [ ! -f "$PERF_CURRENT" ]; then
            echo "ERROR: performance results not found at $PERF_CURRENT"
            exit 1
          fi
          python3 scripts/check_perf_regression.py \
            --baseline "$PERF_BASELINE" \
            --current "$PERF_CURRENT" \
            --max-response-time-regression "$PERF_MAX_RESPONSE_TIME_REGRESSION" \
            --max-memory-regression "$PERF_MAX_MEMORY_REGRESSION"

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.sha }}
          path: target/perf/current.json
          if-no-files-found: ignore

  # ----------------------------------------------------------------
  #  Frontend (TypeScript + Vite build)
  # ----------------------------------------------------------------
  frontend:
    name: Frontend (TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

  # ----------------------------------------------------------------
  #  Unsafe Code Scanner (cargo-geiger)
  # ----------------------------------------------------------------
  geiger:
    name: Unsafe Code Scanner (cargo-geiger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-geiger binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: ${{ runner.os }}-cargo-geiger-0.11.7
          restore-keys: ${{ runner.os }}-cargo-geiger-

      - name: Install cargo-geiger
        run: cargo install cargo-geiger --version =0.11.7 --locked

      - name: Scan for unsafe code
        run: cargo geiger --all-features

  # ----------------------------------------------------------------
  #  License & dependency policy
  # ----------------------------------------------------------------
  deny:
    name: License & Bans (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ----------------------------------------------------------------
  #  Build WASM
  # ----------------------------------------------------------------
  build:
    name: Build WASM (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: [lint, test, deny]
    permissions:
      contents: write
    strategy:
      matrix:
        toolchain: [stable, '1.81']  # MSRV
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
