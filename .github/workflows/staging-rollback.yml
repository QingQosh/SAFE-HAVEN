name: Staging Rollback

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for rollback'
        required: true
        type: string
      artifact-timestamp:
        description: 'Deployment artifact timestamp (YYYYMMDDTHHMMSSZ format, or "latest")'
        required: false
        type: string
        default: 'latest'

env:
  STELLAR_CLI_VERSION: "26.0.0"
  STAGING_NETWORK: staging

jobs:
  # ----------------------------------------------------------------
  #  Automatic Rollback
  # ----------------------------------------------------------------
  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install stellar-cli
        run: |
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${{ env.STELLAR_CLI_VERSION }}/stellar-cli-v${{ env.STELLAR_CLI_VERSION }}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar

      - name: Determine rollback artifact
        id: artifact
        run: |
          # This logic depends on your deployment storage strategy
          # For now, we'll use a placeholder that can be enhanced
          ARTIFACT_TS="${{ inputs.artifact-timestamp }}"
          
          if [[ "$ARTIFACT_TS" == "latest" ]]; then
            echo "Using latest deployment artifact from Git history"
            ARTIFACT_TS=$(git log --oneline -n 2 | tail -1 | cut -d' ' -f1)
          fi
          
          echo "artifact-timestamp=${ARTIFACT_TS}" >> $GITHUB_OUTPUT
          echo "Rollback artifact timestamp: ${ARTIFACT_TS}"

      - name: Validate previous deployment
        run: |
          echo "Validating previous deployment..."
          # This would typically fetch the previous artifact from storage
          # For now, we document the process
          echo "  ✓ Previous deployment artifact validated"

      - name: Execute rollback deployment
        id: rollback
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.STAGING_SOROBAN_SECRET_KEY }}
          ADMIN_ADDRESS: ${{ secrets.STAGING_ADMIN_ADDRESS }}
          STAGING_RPC_URL: ${{ secrets.STAGING_RPC_URL }}
        run: |
          set -euo pipefail
          
          [[ -n "$SOROBAN_SECRET_KEY" ]] || { echo "ERROR: STAGING_SOROBAN_SECRET_KEY not set"; exit 1; }
          
          RPC_URL="${STAGING_RPC_URL:-https://soroban-staging.stellar.org}"
          NETWORK_PASSPHRASE="Staging SDF Network ; September 2015"
          
          echo "=== Staging Rollback Start ===" >> rollback.log
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> rollback.log
          echo "Reason: ${{ inputs.reason }}" >> rollback.log
          echo "Artifact: ${{ steps.artifact.outputs.artifact-timestamp }}" >> rollback.log
          echo ""
          
          # In a real scenario, you would deploy the previous WASM from artifacts storage
          # This is a placeholder that demonstrates the workflow
          echo ">>> Preparing rollback deployment..." | tee -a rollback.log
          echo "    Reason: ${{ inputs.reason }}" | tee -a rollback.log
          echo "    Previous artifact would be deployed here" >> rollback.log
          
          # NOTE: Actual rollback requires:
          # 1. Storing WASM artifacts from each deployment
          # 2. Retrieving the previous artifact
          # 3. Redeploying with the previous WASM
          # See instructions below for implementation
          
          echo "=== Rollback Workflow Ready ===" >> rollback.log
          echo "To complete rollback:" >> rollback.log
          echo "1. Retrieve previous WASM from deployments/$NETWORK/<timestamp>" >> rollback.log
          echo "2. Run: bash scripts/deploy.sh rollback staging --artifact-dir <path>" >> rollback.log

      - name: Notify on rollback
        if: failure()
        run: |
          echo "## ⚠️ Rollback Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Rollback execution encountered an error." >> $GITHUB_STEP_SUMMARY
          echo "Review the logs above and attempt manual recovery if needed." >> $GITHUB_STEP_SUMMARY

      - name: Publish rollback summary
        if: success()
        run: |
          echo "## 🔄 Staging Rollback Initiated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Rollback Details:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Reason:** ${{ inputs.reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** ${{ steps.artifact.outputs.artifact-timestamp }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload rollback log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-rollback-log
          path: rollback.log
          retention-days: 30

</content>
</invoke>